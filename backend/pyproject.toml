[project]
name = "climate-hazard-api"
version = "0.1.0"
description = "Climate hazard trend analyzer API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pymongo>=4.18.3",
    "scipy>=1.18.1",
    "shapely>=2.2.0",
    "slowapi>=0.1.10",
    "tenacity>=9.2.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # the formatter handles line length; long strings stay readable
